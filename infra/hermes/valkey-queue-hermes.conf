# valkey-queue on hermes: the repository's queue policy, plus one override.
#
# The include is the image's own copy of infra/selfhost/valkey/valkey-queue.conf,
# so a release that changes the queue policy reaches hermes with the image and
# this file never has to be re-copied. The entrypoint copies this file to
# /tmp and appends `requirepass`; the include path is absolute, so it still
# resolves from there.
include /usr/local/etc/valkey/valkey-queue.conf

# Local override on hermes: AOF (appendfsync everysec) is the durable copy, and
# AOF rewrites already use an RDB preamble. The periodic RDB snapshots in the
# included file rewrote the whole ~70 MB dataset every few minutes (~450 GB in
# 6 weeks) for no durability gain. Later directives win, so this disables them.
save ""
